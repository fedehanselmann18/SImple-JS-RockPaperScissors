<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booleans</title>
    <link rel="stylesheet" href="rockpaperscissor.css">
</head>
<body class="game-page">
    <h3 class="title">Choose and play!</h3>

    <button class="move-button move-rock"
    onclick="

    computerMove = pickComputerMove()
    
    if (computerMove == 'Rock'){
        alert(`You picked Rock and the oponent ${computerMove} , its a TIE!`);
    }
    else if (computerMove == 'Scissors'){
        alert(`You picked Rock and the oponent ${computerMove} , you won!`);
    }
    else if (computerMove == 'Paper'){
        alert(`You picked Rock and the oponent ${computerMove} , you lost!`);
    }
    "
    >
        Rock
    </button>

    <button class="move-button move-paper"
    onclick="

    computerMove = pickComputerMove()

    if (computerMove == 'Paper'){
        alert(`You picked Paper and the oponent ${computerMove} , its a TIE!`);
    }
    else if (computerMove == 'Rock'){
        alert(`You picked Paper and the oponent ${computerMove} , you won!`);
    }
    else if (computerMove == 'Scissors'){
        alert(`You picked Paper and the oponent ${computerMove} , you lost!`);
    }
    "
    >
        Paper
    </button>

        <button class="move-button move-scissors"
    onclick="

    computerMove = pickComputerMove()

    if (computerMove == 'Scissors'){
        alert(`You picked Scissors and the oponent ${computerMove} , its a TIE!`);
    }
    else if (computerMove == 'Paper'){
        alert(`You picked Scissors and the oponent ${computerMove} , you won!`);
    }
    else if (computerMove == 'Rock'){
        alert(`You picked Scissors and the oponent ${computerMove} , you lost!`);
    }
    "
    >
        Scissors
    </button>


    <script>
        function pickComputerMove() {
            const randomNumber = Math.random()
            let computerMove = ''

            if (randomNumber>=0 && randomNumber<= 1/3){
                computerMove = 'Rock';
            }

            else if (randomNumber>=1/3 && randomNumber<= 2/3){
                computerMove = 'Paper';
            }

            else if (randomNumber>=2/3 && randomNumber<= 1){
                computerMove = 'Scissors';
            }
            return computerMove
        }

    </script>

</body>
</html>
