<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rockpaperscissor.css">
</head>
<body class="game-page">
    <h3 class="title">Choose and play!</h3>

    <button class="move-button move-rock"
    onclick="RpsResult('Rock')"
    >
        Rock
    </button>

    <button class="move-button move-paper"
    onclick="RpsResult('Paper')"
    >
        Paper
    </button>

        <button class="move-button move-scissors"
    onclick="RpsResult('Scissors')"
    >
        Scissors
    </button>
    <button class="move-button"
    onclick="resetScore()">
        Reset Score
    </button>
    <script src = "rockpaperscissors.js">
    </script>

</body>
</html>
