<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rockpaperscissor.css">
</head>
<body class="game-page">
    <main class="game-shell">
        <h1 class="title">Play rock, paper scissors against your computer!</h1>

        <div class="moves-row">
            <button class="move-button move-rock"
            onclick="RpsResult('Rock')"
            >
            <img src="images/Rock.png" class="move-icon" alt="">
            </button>

            <button class="move-button move-paper"
            onclick="RpsResult('Paper')"
            >
            <img src="images/Paper.png" class="move-icon" alt="">
            </button>

            <button class="move-button move-scissors"
            onclick="RpsResult('Scissors')"
            >
            <img src="images/Scissors.png" class="move-icon" alt="">
            </button>
        </div>

        <p class="js-moves"></p>
        <p class="js-score"></p>

        <button class=" reset-button auto-play-button"
        onclick="autoPlay()">
            Autoplay
        </button>
        <button class="reset-button"
        onclick="resetScore()">
            Reset Score
        </button>
    </main>

    <script src = "rockpaperscissors.js"></script>
    <script src="autoplay.js"></script>
</body>
</html>
